name: Update site

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: Read the sheet
        run: python tools/build_data.py

      - name: Save changes
        id: save
        run: |
          git add data assets/banners
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "IgnaRam"
          git config user.email "122803879+IgnRam96@users.noreply.github.com"
          git commit -m "Update data from the sheet"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: data
    if: needs.data.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - run: php tools/build_site.php

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v5
